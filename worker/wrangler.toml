name = "photo-labeler"
main = "photo-labeler.mjs"
compatibility_date = "2026-11-15"
# account_id and the KV namespace id are deployment values, kept out of the
# public tree: copy this file to wrangler.local.toml (gitignored), fill them
# in, and deploy with `npx wrangler deploy -c wrangler.local.toml`.
# See worker/README.md.
account_id = "REPLACE_WITH_ACCOUNT_ID"

[[kv_namespaces]]
binding = "LABELS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
